<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Million CheckBox</title>
    <style>
      body {
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      h1 {
        margin-bottom: 20px;
        font-size: 2em;
      }
      #container {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(30px, 1fr));
        gap: 2px;
      }
      input[type="checkbox"] {
        width: 30px;
        height: 30px;
        cursor: pointer;
        background: #333;
        border: 1px solid #666;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        border-radius: 2px;
        transition: background-color 0.2s;
        position: relative;
      }
      input[type="checkbox"]::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 20px;
        color: white;
      }
      input[type="checkbox"]:checked::after {
        content: '✓';
      }
      input[type="checkbox"]:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
      <script src="/socket.io/socket.io.js"></script>
    <h1>One Million CheckBox</h1>
    <div id="container"></div>
    <script>
       const socket = io();

     // Listening
     socket.on('server:checkbox:change',(data)=>{
        const {index , checked} = data;

        const input = document.getElementById(`checkbox-${index}`);
        if(input){
            input.checked = checked;
        }
     })
     
     
    //  socket.on('server:error',(data)=>{
    //    const errorMessage = data.error;
    //  })

     const container = document.getElementById("container");
     const CHECKBOX_COUNT = 100;
      
     window.addEventListener('load',async ()=>{
        const response = await fetch('/checkboxes' , {method : 'GET'});
        const data = await response.json();
        if(data && data.checkboxes){

        data.checkboxes.forEach((serverValue , index)=>{

        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = serverValue;
        input.id =  `checkbox-${index}`;

        input.addEventListener('change',(event)=>{
        const checked = event.target.checked
        console.log("checkbox changed" , {index , checked});
        socket.emit('client:checkbox:change',{index , checked})
         })
         
        container.appendChild(input);
       })

     }
       });


    </script>
  </body>
</html>
