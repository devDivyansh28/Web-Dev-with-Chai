<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEB Socket Chat App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .chat-container {
        width: 100%;
        max-width: 500px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        height: 600px;
        overflow: hidden;
      }

      .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        border-bottom: 2px solid #667eea;
      }

      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f9f9f9;
    }
    
    .message {
        display: flex;
        margin-bottom: 15px;
        animation: fadeIn 0.3s ease-in;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .message.sent {
        justify-content: flex-end;
    }
    
    .message.received {
        justify-content: flex-start;
      }
      
      .message-text {
          max-width: 70%;
          padding: 12px 16px;
          border-radius: 12px;
          word-wrap: break-word;
          font-size: 14px;
          line-height: 1.4;
        }
        
        .message.sent .message-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        border-bottom-right-radius: 4px;
    }

    .message.received .message-text {
        background: #e0e0e0;
        color: #333;
        border-bottom-left-radius: 4px;
    }
    
    .chat-input-area {
        padding: 20px;
        background: white;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 10px;
      }
      
      #messageInput {
          flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }

      #messageInput:focus {
          border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        font-weight: bold;
        transition:
        transform 0.2s,
        box-shadow 0.2s;
    }
    
    #sendBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    #sendBtn:active {
        transform: translateY(0);
    }
    
    /* Scrollbar styling */
      .messages-container::-webkit-scrollbar {
          width: 8px;
        }
        
        .messages-container::-webkit-scrollbar-track {
            background: #f9f9f9;
        }
        
        .messages-container::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 4px;
        }
        
      .messages-container::-webkit-scrollbar-thumb:hover {
          background: #bbb;
        }
        </style>
  </head>
  <body>
      <div class="chat-container">
          <div class="chat-header">💬 Chat Interface</div>
          <div class="messages-container" id="messagesContainer">
              <div class="message received">
                  <div class="message-text">Hey! Welcome to the chat 👋</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                autocomplete="off"
                />
                <button id="sendBtn">Send</button>
            </div>
        </div>
        
        <script src="/socket.io/socket.io.js"></script> 

        <script>

            const socket = io();


        
                socket.on('server:message',(data)=>{
                    console.log(data);
                    addMessage(data,'received');
                })

            const messageInput = document.getElementById("messageInput");
            const sendBtn = document.getElementById("sendBtn");
            const messagesContainer = document.getElementById("messagesContainer");
            
            // Send message on button click
            sendBtn.addEventListener("click", sendMessage);
            
            // Send message on Enter key
            messageInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
          sendMessage();
        }
      });

      function sendMessage() {
        const message = messageInput.value.trim();
        socket.emit('user:message',message);
        
     

        if (message === "") return;

        // Add sent message to UI
        addMessage(message, "sent");

        // Clear input
        messageInput.value = "";
        messageInput.focus();

        // Simulate received message (replace with actual WebSocket later)
        // setTimeout(() => {
        //   addMessage("Message received! 📨", "received");
        // }, 500);
      }

      function addMessage(text, type) {


        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${type}`;

        const textDiv = document.createElement("div");
        textDiv.className = "message-text";
        textDiv.textContent = text;

        messageDiv.appendChild(textDiv);
        messagesContainer.appendChild(messageDiv);

        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    </script>



  </body>
</html>
